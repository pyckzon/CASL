spring:
  application:
    name: casl-notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/casl}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/casl/protocol/openid-connect/certs}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/casl_notifications}
    username: ${SPRING_DATASOURCE_USERNAME:casl}
    password: ${SPRING_DATASOURCE_PASSWORD:casl_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: casl-notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.casl.*"
        spring.json.value.default.type: "com.casl.notification.domain.event.DomainEventEnvelope"

server:
  port: 8674

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    enable:
      kafka: true
    tags:
      service: ${spring.application.name}

casl:
  security:
    user-status:
      base-url: ${USERS_SERVICE_URI:http://localhost:8666}
