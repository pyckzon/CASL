spring:
  application:
    name: casl-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: users-service
              uri: ${USERS_SERVICE_URI:http://localhost:8666}
              predicates:
                - Path=/api/users/**
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URI:http://localhost:8670}
              predicates:
                - Path=/api/catalog/**
            - id: cart-service
              uri: ${CART_SERVICE_URI:http://localhost:8671}
              predicates:
                - Path=/api/cart/**
            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://localhost:8672}
              predicates:
                - Path=/api/orders/**
            - id: shipping-service
              uri: ${SHIPPING_SERVICE_URI:http://localhost:8675}
              predicates:
                - Path=/api/shipping/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8673}
              predicates:
                - Path=/api/payments/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
