spring:
  application:
    name: casl-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: users-service
              uri: ${USERS_SERVICE_URI:http://localhost:8666}
              predicates:
                - Path=/api/users/**
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URI:http://localhost:8670}
              predicates:
                - Path=/api/catalog/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
