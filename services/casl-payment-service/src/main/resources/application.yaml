spring:
  application:
    name: casl-payment-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/casl}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/casl/protocol/openid-connect/certs}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/casl_payments}
    username: ${SPRING_DATASOURCE_USERNAME:casl}
    password: ${SPRING_DATASOURCE_PASSWORD:casl_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8673

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
