name: CI

on:
  pull_request:
  push:
    branches: [Master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose profiles
        run: docker compose --profile core --profile observability config -q

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: "**/build/reports/tests/test/"
          if-no-files-found: ignore

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # ubuntu-latest trae Docker: Testcontainers funciona sin configuraciÃ³n extra.
      # El gate de cobertura se evalÃºa aquÃ­ porque suma unitarios + integraciÃ³n.
      - name: Integration tests + coverage gate
        run: ./gradlew test integrationTest jacocoTestCoverageVerification --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: "**/build/reports/jacoco/"
          if-no-files-found: ignore

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: "**/build/reports/tests/integrationTest/"
          if-no-files-found: ignore

  trivy:
    name: trivy image scan (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # MediciÃ³n en Fase 2.3: reporta, no bloquea. Se vuelve bloqueante
    # en Fase 3 si el ruido y la duraciÃ³n son aceptables.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build users image
        run: ./gradlew :services:casl-users-service:bootBuildImage --no-daemon

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'casl/casl-users-service:0.0.1-SNAPSHOT'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

  sbom:
    name: sbom + trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxDirectBom --no-daemon

      - name: Upload SBOM reports
        uses: actions/upload-artifact@v7
        with:
          name: sbom-reports
          path: "**/build/reports/sbom/*.json"
          if-no-files-found: error
        if: always()

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true
          version: "v0.70.0"   # tag real del release de Trivy (el install.sh resuelve `releases/<version>` y el tag es `v0.70.0`)

      - name: Scan SBOM with Trivy
        run: |
          set -o pipefail
          COUNT=$(find services -path '*/build/reports/sbom/*-bom.json' | wc -l)
          if [ "$COUNT" -ne 9 ]; then
            echo "::error::Expected 9 SBOM files, found $COUNT"
            exit 1
          fi
          FAIL=0
          for f in $(find services -path '*/build/reports/sbom/*-bom.json'); do
            echo "Scanning $(basename "$f")..."
            trivy sbom --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table --output "trivy-$(basename "$f" .json).txt" --ignorefile .trivyignore.yaml "$f"
            EXIT_CODE=$?
            if [ $EXIT_CODE -ne 0 ]; then
              FAIL=1
              echo "Vulnerabilities found in $(basename "$f")"
            else
              echo "No CRITICAL/HIGH vulnerabilities in $(basename "$f")"
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "::error::SBOM scan found CRITICAL or HIGH vulnerabilities"
            exit 1
          fi

      - name: Upload Trivy SBOM reports
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sbom-reports
          path: "trivy-*.txt"
          if-no-files-found: ignore
        if: always()


  iac:
    name: trivy config (helm misconfiguration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Render helm chart
        run: |
          helm dependency update infra/charts/casl
          helm lint infra/charts/casl
          mkdir -p /tmp/rendered
          helm template casl infra/charts/casl > /tmp/rendered/rendered.yaml
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true
          version: "v0.76.2"
      - name: Trivy config scan (rendered helm)
        run: |
          # Los hallazgos restantes provienen de los subcharts upstream
          # (node-exporter, kube-prometheus-operator, admission, tempo) y son
          # inherentes a esos charts; se documentan como excepciones (ADR-021 §8).
          trivy config --severity CRITICAL,HIGH --exit-code 1 \
            --ignorefile .trivyignore.yaml /tmp/rendered
      - name: Trivy config scan (k8s manifests)
        run: |
          trivy config --severity CRITICAL,HIGH --exit-code 1 \
            --ignorefile .trivyignore.yaml infra/k8s

      - name: Validate k8s manifests (YAML syntax)
        run: |
          python3 - <<'PY'
          import glob, yaml, sys
          files = []
          for pat in ("infra/k8s/**/*.yaml",):
              files += glob.glob(pat, recursive=True)
          for f in sorted(files):
              with open(f) as fh:
                  for i, doc in enumerate(yaml.safe_load_all(fh), 1):
                      if doc is None:
                          continue
                      if not isinstance(doc, dict):
                          print(f"::error file={f}::document {i} is not a mapping")
                          sys.exit(1)
          print(f"Validated {len(files)} manifest files")
          PY
