name: casl

volumes:
  pg_users_data:
  pg_catalog_data:
  pg_orders_data:
  pg_payments_data:
  pg_notifications_data:
  pg_shipping_data:
  prometheus_data:
  tempo_data:
  grafana_data:
  loki_data:

services:
  # ========================================================================
  # Perfil: core
  # ========================================================================
  postgres-users:
    profiles: [core]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casl_users
      POSTGRES_USER: casl
      POSTGRES_PASSWORD: casl_dev
    ports: ["5433:5432"]
    volumes: [pg_users_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casl -d casl_users"]
      interval: 5s
      retries: 10

  casl-users-service:
    profiles: [core]
    image: casl/casl-users-service:0.0.1-SNAPSHOT
    depends_on:
      postgres-users:
        condition: service_healthy
    environment:
      SERVER_PORT: 8666
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: "1.0"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-users:5432/casl_users
      SPRING_DATASOURCE_USERNAME: casl
      SPRING_DATASOURCE_PASSWORD: casl_dev
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/casl
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/casl/protocol/openid-connect/certs
    ports: ["8666:8666"]

  redis:
    profiles: [core]
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres-catalog:
    profiles: [core]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casl_catalog
      POSTGRES_USER: casl
      POSTGRES_PASSWORD: casl_dev
    ports: ["5434:5432"]
    volumes: [pg_catalog_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casl -d casl_catalog"]
      interval: 5s
      retries: 10

  casl-catalog-service:
    profiles: [core]
    image: casl/casl-catalog-service:0.0.1-SNAPSHOT
    depends_on:
      postgres-catalog:
        condition: service_healthy
      redis:
        condition: service_healthy
      casl-users-service:
        condition: service_started
    environment:
      SERVER_PORT: 8670
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: "1.0"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-catalog:5432/casl_catalog
      SPRING_DATASOURCE_USERNAME: casl
      SPRING_DATASOURCE_PASSWORD: casl_dev
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      USERS_SERVICE_URI: http://casl-users-service:8666
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/casl
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/casl/protocol/openid-connect/certs
    ports: ["8670:8670"]

  casl-cart-service:
    profiles: [core]
    image: casl/casl-cart-service:0.0.1-SNAPSHOT
    depends_on:
      redis:
        condition: service_healthy
      casl-users-service:
        condition: service_started
    environment:
      SERVER_PORT: 8671
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: "1.0"
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      CASL_CART_TTL_MINUTES: 1440
      CATALOG_BASE_URL: http://casl-catalog-service:8670
      USERS_SERVICE_URI: http://casl-users-service:8666
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/casl
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/casl/protocol/openid-connect/certs
    ports: ["8671:8671"]

  postgres-orders:
    profiles: [core]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casl_orders
      POSTGRES_USER: casl
      POSTGRES_PASSWORD: casl_dev
    ports: ["5435:5432"]
    volumes: [pg_orders_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casl -d casl_orders"]
      interval: 5s
      retries: 10

  casl-order-service:
    profiles: [core]
    image: casl/casl-order-service:0.0.1-SNAPSHOT
    depends_on:
      postgres-orders:
        condition: service_healthy
      casl-users-service:
        condition: service_started
    environment:
      SERVER_PORT: 8672
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: "1.0"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-orders:5432/casl_orders
      SPRING_DATASOURCE_USERNAME: casl
      SPRING_DATASOURCE_PASSWORD: casl_dev
      PAYMENT_BASE_URL: http://casl-payment-service:8673
      CASL_PAYMENT_SIMULATED: "false"
      USERS_SERVICE_URI: http://casl-users-service:8666
    ports: ["8672:8672"]

  postgres-payments:
    profiles: [core]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casl_payments
      POSTGRES_USER: casl
      POSTGRES_PASSWORD: casl_dev
    ports: ["5436:5432"]
    volumes: [pg_payments_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casl -d casl_payments"]
      interval: 5s
      retries: 10

  casl-payment-service:
    profiles: [core]
    image: casl/casl-payment-service:0.0.1-SNAPSHOT
    depends_on:
      postgres-payments:
        condition: service_healthy
      casl-users-service:
        condition: service_started
    environment:
      SERVER_PORT: 8673
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: "1.0"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payments:5432/casl_payments
      SPRING_DATASOURCE_USERNAME: casl
      SPRING_DATASOURCE_PASSWORD: casl_dev
      USERS_SERVICE_URI: http://casl-users-service:8666
    ports: ["8673:8673"]

  kafka:
    profiles: [core]
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  postgres-notifications:
    profiles: [core]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casl_notifications
      POSTGRES_USER: casl
      POSTGRES_PASSWORD: casl_dev
    ports: ["5437:5432"]
    volumes: [pg_notifications_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casl -d casl_notifications"]
      interval: 5s
      retries: 10

  casl-notification-service:
    profiles: [core]
    image: casl/casl-notification-service:0.0.1-SNAPSHOT
    depends_on:
      postgres-notifications:
        condition: service_healthy
      kafka:
        condition: service_healthy
      casl-users-service:
        condition: service_started
    environment:
      SERVER_PORT: 8674
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: "1.0"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notifications:5432/casl_notifications
      SPRING_DATASOURCE_USERNAME: casl
      SPRING_DATASOURCE_PASSWORD: casl_dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USERS_SERVICE_URI: http://casl-users-service:8666
    ports: ["8674:8674"]

  casl-gateway:
    profiles: [core]
    image: casl/casl-gateway:0.0.1-SNAPSHOT
    depends_on:
      - casl-users-service
      - casl-catalog-service
      - casl-cart-service
      - casl-order-service
      - casl-payment-service
    environment:
      SERVER_PORT: 8080
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: "1.0"
      USERS_SERVICE_URI: http://casl-users-service:8666
      CATALOG_SERVICE_URI: http://casl-catalog-service:8670
      CART_SERVICE_URI: http://casl-cart-service:8671
      ORDER_SERVICE_URI: http://casl-order-service:8672
      PAYMENT_SERVICE_URI: http://casl-payment-service:8673
      SHIPPING_SERVICE_URI: http://casl-shipping-service:8675
    ports: ["8080:8080"]

  casl-shipping-service:
    profiles: [core]
    image: casl/casl-shipping-service:0.0.1-SNAPSHOT
    depends_on:
      postgres-shipping:
        condition: service_healthy
      kafka:
        condition: service_healthy
      casl-users-service:
        condition: service_started
    environment:
      SERVER_PORT: 8675
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: "1.0"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-shipping:5432/casl_shipping
      SPRING_DATASOURCE_USERNAME: casl
      SPRING_DATASOURCE_PASSWORD: casl_dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USERS_SERVICE_URI: http://casl-users-service:8666
    ports: ["8675:8675"]

  postgres-shipping:
    profiles: [core]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casl_shipping
      POSTGRES_USER: casl
      POSTGRES_PASSWORD: casl_dev
    ports: ["5438:5432"]
    volumes: [pg_shipping_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casl -d casl_shipping"]
      interval: 5s
      retries: 10

  keycloak:
    profiles: [core]
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HTTP_PORT: 8080
    ports: ["8180:8080"]
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ========================================================================
  # Perfil: observability (solo servicios, sin networks ipv4_address)
  # ========================================================================
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.16.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - alertmanager

  alertmanager:
    profiles: [observability]
    image: prom/alertmanager:v0.35.0
    ports:
      - "9093:9093"
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.6
    ports:
      - "3000:3000"
    volumes:
      - ./infra/observability/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/observability/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro

  tempo:
    profiles: [observability]
    image: grafana/tempo:3.1.1
    ports:
      - "4318:4318"
      - "4317:4317"
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    command:
      - -config.file=/etc/tempo/tempo.yaml

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.10
    ports:
      - "3100:3100"
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/local-config.yaml

  promtail:
    profiles: [observability]
    image: grafana/promtail:3.6.11
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
    command:
      - -config.file=/etc/promtail/config.yaml