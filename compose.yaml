name: casl

services:
  # ========================================================================
  # Perfil: core
  # ========================================================================

  postgres-users:
    profiles:
      - core
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casl_users
      POSTGRES_USER: casl
      POSTGRES_PASSWORD: casl_dev
    ports:
      - "5433:5432"
    volumes:
      - pg_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casl -d casl_users"]
      interval: 5s
      retries: 10

  casl-users-service:
    profiles:
      - core
    image: casl/casl-users-service:0.0.1-SNAPSHOT
    depends_on:
      postgres-users:
        condition: service_healthy
    environment:
      SERVER_PORT: 8666
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-users:5432/casl_users
      SPRING_DATASOURCE_USERNAME: casl
      SPRING_DATASOURCE_PASSWORD: casl_dev
    ports:
      - "8666:8666"
    # Sin healthcheck de contenedor: la imagen buildpacks no incluye shell
    # ni curl/wget (exec: "sh": executable file not found). El health de la
    # app se expone en /actuator/health. El healthcheck de contenedor se
    # implementará en Kubernetes (Fase 7).

  # ========================================================================
  # Perfil: observability (reservado: Prometheus, Grafana, Loki, Tempo)
  # Perfil: cloud (reservado: Kafka, Keycloak, Config, Discovery)
  # ========================================================================

  casl-gateway:
    profiles:
      - core
    image: casl/casl-gateway:0.0.1-SNAPSHOT
    depends_on:
      - casl-users-service
    environment:
      SERVER_PORT: 8080
      USERS_SERVICE_URI: http://casl-users-service:8666
      CATALOG_SERVICE_URI: http://casl-catalog-service:8670
      CART_SERVICE_URI: http://casl-cart-service:8671
    ports:
      - "8080:8080"

  redis:
    profiles:
      - core
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres-catalog:
    profiles:
      - core
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casl_catalog
      POSTGRES_USER: casl
      POSTGRES_PASSWORD: casl_dev
    ports:
      - "5434:5432"
    volumes:
      - pg_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casl -d casl_catalog"]
      interval: 5s
      retries: 10

  casl-catalog-service:
    profiles:
      - core
    image: casl/casl-catalog-service:0.0.1-SNAPSHOT
    depends_on:
      postgres-catalog:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8670
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-catalog:5432/casl_catalog
      SPRING_DATASOURCE_USERNAME: casl
      SPRING_DATASOURCE_PASSWORD: casl_dev
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8670:8670"

  casl-cart-service:
    profiles:
      - core
    image: casl/casl-cart-service:0.0.1-SNAPSHOT
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8671
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      CASL_CART_TTL_MINUTES: 1440
      CATALOG_BASE_URL: http://casl-catalog-service:8670
    ports:
      - "8671:8671"

volumes:
  pg_users_data:
  pg_catalog_data:
