# PostgreSQL 17 compartido para el cluster local (Fase 10).
apiVersion: v1
kind: ConfigMap
metadata:
  name: casl-postgres-init
  namespace: casl
data:
  init.sql: |
    CREATE USER casl WITH PASSWORD 'casl';
    CREATE DATABASE casl_users OWNER casl;
    CREATE DATABASE casl_catalog OWNER casl;
    CREATE DATABASE casl_cart OWNER casl;
    CREATE DATABASE casl_orders OWNER casl;
    CREATE DATABASE casl_payments OWNER casl;
    CREATE DATABASE casl_notifications OWNER casl;
    CREATE DATABASE casl_shipping OWNER casl;
    CREATE DATABASE keycloak OWNER casl;
    GRANT ALL PRIVILEGES ON DATABASE casl_users TO casl;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: casl
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              value: casl
            - name: POSTGRES_PASSWORD
              value: casl
            - name: POSTGRES_DB
              value: casl_users
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run/postgresql
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: casl-postgres-init
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: casl
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432