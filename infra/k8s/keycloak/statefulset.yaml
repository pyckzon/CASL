apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: casl
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: casl/keycloak:26.8
          args: ["start", "--optimized", "--import-realm"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 15
          env:
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/keycloak"
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: casl-keycloak
                  key: KC_DB_PASSWORD
            - name: KC_HOSTNAME
              value: "keycloak.casl.local"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /opt/keycloak/certs/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /opt/keycloak/certs/tls.key
            - name: KC_CASL_ORDER_SECRET
              valueFrom:
                secretKeyRef:
                  name: casl-keycloak
                  key: KC_CASL_ORDER_SECRET
            - name: KC_CASL_USERS_SECRET
              valueFrom:
                secretKeyRef:
                  name: casl-keycloak
                  key: KC_CASL_USERS_SECRET
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: casl-keycloak
                  key: admin_password
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: certs
              mountPath: /opt/keycloak/certs
              readOnly: true
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /opt/keycloak/data
      volumes:
        - name: certs
          secret:
            secretName: keycloak-tls
        - name: realm-import
          configMap:
            name: casl-keycloak-realm
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
