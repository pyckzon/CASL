apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: casl
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8
          args: ["start", "--import-realm"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/keycloak"
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: casl-keycloak
                  key: KC_DB_PASSWORD
            - name: KC_HOSTNAME
              value: "keycloak.casl.local"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /opt/keycloak/certs/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /opt/keycloak/certs/tls.key
            - name: KC_CASL_ORDER_SECRET
              valueFrom:
                secretKeyRef:
                  name: casl-keycloak
                  key: KC_CASL_ORDER_SECRET
            - name: KC_CASL_USERS_SECRET
              valueFrom:
                secretKeyRef:
                  name: casl-keycloak
                  key: KC_CASL_USERS_SECRET
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: casl-keycloak
                  key: admin_password
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: certs
              mountPath: /opt/keycloak/certs
              readOnly: true
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: keycloak-tls
        - name: realm-import
          configMap:
            name: casl-keycloak-realm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: casl-keycloak-realm
  namespace: casl
data:
  realm-export.json: |
    # Reemplazar con el contenido de infra/k8s/keycloak/realm-export.json (parametrizado)