apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: casl
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    cert-manager.io/cluster-issuer: casl-ca-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - keycloak.casl.local
      secretName: keycloak-tls
  rules:
    - host: keycloak.casl.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8443