apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casl-postgres-password
  namespace: casl
spec:
  secretStoreRef:
    name: casl-vault
    kind: SecretStore
  target:
    name: casl-postgres
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: casl/postgres
        property: password
  refreshInterval: 15s