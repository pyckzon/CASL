apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casl-keycloak-secrets
  namespace: casl
spec:
  secretStoreRef:
    name: casl-vault
    kind: SecretStore
  target:
    name: casl-keycloak
    creationPolicy: Owner
  data:
    - secretKey: KC_DB_PASSWORD
      remoteRef:
        key: casl/keycloak
        property: db_password
    - secretKey: KC_CASL_ORDER_SECRET
      remoteRef:
        key: casl/keycloak
        property: order_client_secret
    - secretKey: KC_CASL_USERS_SECRET
      remoteRef:
        key: casl/keycloak
        property: users_client_secret
    - secretKey: admin_password
      remoteRef:
        key: casl/keycloak
        property: admin_password
  refreshInterval: 15s