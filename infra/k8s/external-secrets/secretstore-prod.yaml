apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: casl-vault
  namespace: casl
spec:
  provider:
    vault:
      server: "https://vault:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: Secret
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "casl"
          serviceAccountRef:
            name: "external-secrets"
          audiences:
            - "vault"