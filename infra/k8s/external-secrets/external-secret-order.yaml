apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casl-order-client-secret
  namespace: casl
spec:
  secretStoreRef:
    name: casl-vault
    kind: SecretStore
  target:
    name: casl-order-client
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: casl/order
        property: client_secret
  refreshInterval: 15s