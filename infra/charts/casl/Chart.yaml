apiVersion: v2
name: casl
description: CASL umbrella chart (8 services + observability)
type: application
version: 0.1.0
appVersion: 0.0.1-SNAPSHOT
kubeVersion: ">=1.25.0"
keywords:
  - casl
  - spring-boot
maintainers:
  - name: CASL team
dependencies:
  - name: kube-prometheus-stack
    version: 93.11.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: observability.enabled
  - name: loki
    version: 21.6.0
    repository: https://grafana-community.github.io/helm-charts
    condition: observability.enabled
  - name: tempo
    version: 3.2.1
    repository: https://grafana-community.github.io/helm-charts
    condition: observability.enabled