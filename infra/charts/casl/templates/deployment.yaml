{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "casl.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default $.Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $.Values.managementPort }}"
        prometheus.io/path: /actuator/prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: {{ $name }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
            - containerPort: {{ $.Values.managementPort }}
              name: management
          env:
            - name: SERVER_PORT
              value: "{{ $svc.port }}"
            - name: MANAGEMENT_SERVER_PORT
              value: "{{ $.Values.managementPort }}"
            - name: KEYCLOAK_ISSUER_URI
              value: "{{ $.Values.keycloak.issuerUri }}"
            - name: KEYCLOAK_JWK_URI
              value: "{{ $.Values.keycloak.jwkUri }}"
            - name: KEYCLOAK_TOKEN_URI
              value: "{{ $.Values.keycloak.tokenUri }}"
            - name: OTLP_TRACES_ENDPOINT
              value: "{{ $.Values.otlp.endpoint }}"
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            {{- range $s := $svc.secrets }}
            - secretRef:
                name: {{ $s }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ $.Values.managementPort }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ $.Values.managementPort }}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml ($svc.resources | default $.Values.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}