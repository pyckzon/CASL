apiVersion: 1

datasources:
  - name: Prometheus
    uid: casl-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Tempo
    uid: casl-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: casl-loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        tags: [{key: "service", value: "service"}]
  - name: Loki
    uid: casl-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
