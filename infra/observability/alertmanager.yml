global:
  smtp_smarthost: 'mailpit:1025'
  smtp_require_tls: false
  smtp_from: 'casl-alerts@casl.local'

route:
  receiver: casl-email
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers:
        - severity = "high"
      receiver: casl-email

receivers:
  - name: casl-email
    email_configs:
      - to: 'casl-alerts@casl.local'
        send_resolved: true
        headers:
          Subject: '{{ template "email.default.subject" . }}'

inhibit_rules:
  - source_matchers:
      - alertname = "CaslHighHttpErrorRate"
    target_matchers:
      - severity = "warning"
    equal:
      - service

