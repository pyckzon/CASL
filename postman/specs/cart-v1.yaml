openapi: 3.1.0
info:
  title: CASL Cart API
  version: 1.0.0
  summary: Carrito de compras (Redis); el propietario se deriva del JWT validado
  description: |
    Contrato del servicio de carrito. El propietario se deriva del JWT validado.
    Estado del usuario (Fase 7): el estado se comprueba en todos los endpoints protegidos; inactivo → `403` `USER_INACTIVE`; indisponibilidad de `users` → `503` `USER_STATUS_UNAVAILABLE`.
servers:
  - url: http://localhost:8671
    description: Servicio directo
  - url: http://localhost:8080
    description: A través del gateway
security:
  - bearerAuth: []
tags:
  - name: Carts
paths:
  /api/cart/v1/carts:
    post:
      operationId: createCart
      tags: [Carts]
      description: Crea el carrito del sujeto autenticado. No se acepta `userId` del cliente.
      responses:
        '201':
          description: Carrito creado
          headers:
            Location: { schema: { type: string, format: uri } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/cart/v1/carts/{cartId}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: getCart
      tags: [Carts]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: clearCart
      tags: [Carts]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cart/v1/carts/{cartId}/items:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: addItem
      tags: [Carts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddItemRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/cart/v1/carts/{cartId}/items/{productId}:
    parameters: [ { $ref: '#/components/parameters/Id' }, { name: productId, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      operationId: updateQuantity
      tags: [Carts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateQuantityRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeItem
      tags: [Carts]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cart/v1/carts/{cartId}/merge:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: mergeCarts
      tags: [Carts]
      description: Ambos carritos deben pertenecer al sujeto autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeCartRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT emitido por Keycloak (realm `casl`)
  parameters:
    Id:
      name: cartId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    AddItemRequest:
      type: object
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string }
        quantity: { type: integer, minimum: 1, default: 1 }
    UpdateQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 0 }
    MergeCartRequest:
      type: object
      required: [sourceCartId]
      properties:
        sourceCartId: { type: string, format: uuid }
    CartItemResponse:
      type: object
      required: [productId, sku, name, unitPrice, currency, quantity, lineTotal]
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        unitPrice: { type: number }
        currency: { type: string }
        quantity: { type: integer }
        lineTotal: { type: number }
    CartResponse:
      type: object
      required: [cartId, items, totalItems, totalAmount, createdAt, updatedAt]
      properties:
        cartId: { type: string, format: uuid }
        userId: { type: string, format: uuid, nullable: true, description: Subject del JWT que creó el carrito }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItemResponse' }
        totalItems: { type: integer }
        totalAmount: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Problem:
      $ref: './users-v1.yaml#/components/schemas/Problem'
  responses:
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Sin rol USER/ADMIN o carrito ajeno
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Carrito no encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Producto no disponible
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
